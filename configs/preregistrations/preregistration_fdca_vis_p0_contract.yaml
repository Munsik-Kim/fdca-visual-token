    randomize: false
    compile: false
    top_k: -1
    replay: true
    instrumentation_equivalence: true
  - id: halton_second_seed_5678
    sampler: halton
    seed: 5678
    class_id: 207
    batch_size: 1
    image_size: 256
    randomize: false
    compile: false
    top_k: -1
    replay: true
  - id: confidence_no_gumbel_seed_1234
    sampler: confidence
    seed: 1234
    class_id: 207
    batch_size: 1
    image_size: 256
    gumbel_mode: none_or_zero_temperature_if_supported
    compile: false
    top_k: -1
  - id: confidence_official_gumbel_seed_1234
    sampler: confidence
    seed: 1234
    class_id: 207
    batch_size: 1
    image_size: 256
    gumbel_mode: official_or_linear_source_path
    compile: false
    top_k: -1
