  upstream_env_yaml_is_provenance_only: true
  driver_changes: prohibited
  existing_environment_modification: prohibited
  install_only_inference_audit_dependencies: true
smoke_cases:
  - id: halton_primary_seed_1234
    sampler: halton
    seed: 1234
    class_id: 207
