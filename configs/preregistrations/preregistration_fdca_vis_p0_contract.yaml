literature_priority:
  - MaskGIT
  - Halton Scheduler for Masked Generative Image Transformer
  - Demystifying MaskGIT Sampler and Beyond
  - Jump Your Steps
  - Error Bounds and Optimal Schedules for Masked Diffusions with Factorized Approximations
  - Optimal Inference Schedules for Masked Diffusion Models
  - Confidence-Based Decoding is Provably Efficient for Diffusion Language Models
  - Entropy Bounded Unmasking
  - Path Planning for Masked Diffusion Model Sampling
  - Train for the Worst, Plan for the Best
  - maximal agreement coupling and MEXIT
  - Dobrushin comparison and influence-matrix literature
  - directly relevant masked-generator quantization and caching
contract_questions:
  - halton_branch_independent_schedule
  - halton_accepted_token_future_immutability
  - halton_32_step_cumulative_and_incremental_counts
  - halton_returned_mask_and_code_semantics
  - confidence_committed_value_revisions
  - confidence_occupancy_vs_token_value_monotonicity
  - categorical_numpy_gumbel_and_spatial_rng_paths
  - instrumented_vs_original_byte_identity
  - vq_grid_to_image_mapping
  - p05_runtime_and_vram_feasibility
p05_contract_freeze:
  bounds:
    - B_stable
    - B_clipped
    - B_combined=min(B_stable,B_clipped)
  estimands:
    - single_shock_propagation
    - persistent_approximation
  separate_measurements:
    - direct_innovation_b
    - state_influence_M
    - first_split_seed
    - future_fresh_innovations
  measured_language:
    - local_accounting
    - finite_panel_measured_envelope
    - population_UCB
    - global_certificate
gates:
  literature: [PASS_G0_LIT, FAIL_G0_LIT]
  halton_contract: [PASS_G0_CONTRACT_HALTON, FAIL_G0_CONTRACT_HALTON]
  confidence:
    - CONFIDENCE_TOKEN_MONOTONE
    - CONFIDENCE_OCCUPANCY_ONLY_MONOTONE
    - CONFIDENCE_CONTRACT_INCOMPLETE
  runtime_assets: [PASS_P0_RUNTIME_ASSETS, INCOMPLETE_P0_RUNTIME_ASSETS]
  overall:
    - PASS_FDCA_VIS_P0_CONTRACT
    - FAIL_FDCA_VIS_P0_CONTRACT
    - INCOMPLETE_FDCA_VIS_P0_CONTRACT
prohibitions:
  - W8_or_W4_scientific_sweep
  - final_coupling_experiment
  - influence_matrix_measurement
  - P05_execution
  - ImageNet_download
  - FID_IS_LPIPS_DINO
  - training
  - caching_experiment
  - external_gpu
  - git_remote_or_push
stop_rule: STOP_AFTER_P0_ZIPS_PENDING_USER_REVIEW
