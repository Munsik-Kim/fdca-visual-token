name: paper-build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install pypdf==5.9.0
      - uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b
        with:
          root_file: FDCA_v1.0.0.tex
          working_directory: paper/source
          latexmk_use_xelatex: false
      - run: python scripts/check_paper_pages.py paper/FDCA_v1.0.0.pdf paper/source/FDCA_v1.0.0.pdf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FDCA-v1.0.0-paper
          path: paper/source/FDCA_v1.0.0.pdf
